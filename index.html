<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#351b24">
  <title>Sidrasweet | Find Your Sweet Moment</title>
  <style>
    /* If you have the NRTBold font file, place it beside this HTML file
       and name it NRTBold.woff2, then uncomment the @font-face rule. */
    /*
    @font-face {
      font-family: "NRTBold";
      src: url("NRTBold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    */

    :root {
      --plum: #351b24;
      --berry: #6d3547;
      --rose: #d98c9b;
      --cream: #fff7ef;
      --gold: #d9b77e;
      --ink: #3b2630;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 34px 18px;
      display: grid;
      place-items: center;
      color: var(--cream);
      font-family: "NRTBold", "NRT Bold", "Arial", sans-serif;
      background:
        radial-gradient(ellipse at 12% 12%, #8a4b5b66 0, transparent 34%),
        radial-gradient(ellipse at 88% 88%, #d9b77e33 0, transparent 34%),
        linear-gradient(145deg, #24131b, var(--plum) 55%, #1e1118);
      overflow-x: hidden;
    }
    .wrap { width: 100%; max-width: 440px; position: relative; }
    .card {
      position: relative;
      overflow: hidden;
      padding: 38px 26px 27px;
      border: 1px solid #e6c99b55;
      border-radius: 30px;
      text-align: center;
      background: linear-gradient(160deg, #fff8f0 0%, #f8e8e1 100%);
      color: var(--ink);
      box-shadow: 0 28px 80px #0007, inset 0 0 0 5px #fff8;
    }
    .card::before, .card::after {
      content: "✦";
      position: absolute;
      color: #c99c66;
      opacity: .55;
      font-size: 25px;
    }
    .card::before { top: 22px; left: 22px; }
    .card::after { top: 22px; right: 22px; }
    .emblem {
      width: 94px; height: 94px; margin: 0 auto 18px;
      display: grid; place-items: center;
      border-radius: 30px 30px 30px 10px;
      color: #fff7ef;
      font-size: 43px;
      background: linear-gradient(145deg, #9a596b, #492532);
      border: 3px solid #e2c28d;
      box-shadow: 0 9px 22px #49253235;
      transform: rotate(-3deg);
    }
    h1 {
      margin: 0;
      color: var(--plum);
      font-size: clamp(34px, 9vw, 43px);
      line-height: 1.1;
      letter-spacing: -.8px;
    }
    .tagline {
      margin: 11px 0 25px;
      color: #8d5a68;
      font-size: 13px;
      letter-spacing: 2.6px;
      text-transform: uppercase;
    }
    .ornament {
      display: flex; align-items: center; gap: 12px;
      margin: 0 0 21px; color: #b68a5d; font-size: 13px;
    }
    .ornament::before, .ornament::after {
      content: ""; height: 1px; flex: 1; background: #d9bd9e;
    }
    .links { display: grid; gap: 12px; }
    .link {
      min-height: 61px;
      display: flex; align-items: center; gap: 14px;
      padding: 12px 17px;
      border: 1px solid #ead8ca;
      border-radius: 17px;
      color: #fffaf5;
      text-decoration: none;
      text-align: left;
      background: linear-gradient(100deg, #593040, #774354);
      box-shadow: 0 6px 14px #49253218;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }
    .link:hover {
      transform: translateY(-3px);
      box-shadow: 0 11px 20px #4925322b;
      filter: brightness(1.08);
    }
    .icon {
      width: 37px; height: 37px; flex: 0 0 37px;
      display: grid; place-items: center;
      border-radius: 12px;
      color: #4a2933; background: #f3d9ce;
      font: 700 20px Arial, sans-serif;
    }
    .link-label { font-size: 16px; font-weight: 700; }
    .link-detail { display: block; margin-top: 3px; color: #e9cbd0; font: 11px Arial, sans-serif; }
    .arrow { margin-left: auto; color: #e7c995; font: 26px Arial, sans-serif; }
    .footer {
      margin-top: 24px; color: #9c7880;
      font: 11px Arial, sans-serif; letter-spacing: .6px;
    }
    .outside-note {
      margin: 16px 0 0; text-align: center;
      color: #d7bdc3; font: 11px/1.6 Arial, sans-serif;
    }
    @media (max-width: 360px) {
      .card { padding: 34px 18px 24px; }
      .link { padding-inline: 13px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="emblem" aria-hidden="true">S</div>
      <h1>Sidrasweet</h1>
      <p class="tagline">A little moment of sweetness</p>
      <div class="ornament" aria-hidden="true">CONNECT WITH US</div>

      <nav class="links" aria-label="Sidrasweet contact links">
        <a class="link" href="https://wa.me/9647744660180" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">W</span>
          <span><span class="link-label">WhatsApp</span><span class="link-detail">Chat with Sidrasweet</span></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="link" href="https://t.me/uuoop900" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">➤</span>
          <span><span class="link-label">Telegram</span><span class="link-detail">Follow us on Telegram</span></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="link" href="viber://chat?number=%2B9647744660180">
          <span class="icon" aria-hidden="true">V</span>
          <span><span class="link-label">Viber</span><span class="link-detail">Message us on Viber</span></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      </nav>

      <div class="footer">© <span id="year"></span> SIDRASWEET · MADE WITH SWEETNESS</div>
    </section>
    <p class="outside-note">Tap a button above to connect with us.</p>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
